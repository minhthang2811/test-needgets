<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics><style>
@keyframes neeFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes neeShadow{0%,100%{transform:scaleX(1);opacity:.12}50%{transform:scaleX(.96);opacity:.092}}
@keyframes neeBlink{0%,95%,100%{transform:scaleY(1)}97.5%{transform:scaleY(.12)}}
@keyframes neeZ{0%{opacity:0;transform:translate(0,0) scale(.7)}25%{opacity:.65}100%{opacity:0;transform:translate(9px,-24px) scale(1.05)}}
@keyframes neeSpark{0%{opacity:0;transform:scale(.35)}35%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.6);filter:blur(3px)}}
@keyframes neeHop{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-10px) rotate(10deg)}50%{transform:translateY(0) rotate(0)}75%{transform:translateY(-8px) rotate(-10deg)}}
</style></helmet>
<div style="position:relative;width:100%;animation:neeFloat 3s cubic-bezier(.45,0,.55,1) infinite">
  <svg viewBox="0 0 120 138" style="width:100%;height:auto;display:block;overflow:visible">
    <defs>
      <linearGradient id="neeEdge" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#3D3A46" stop-opacity=".6"></stop>
        <stop offset=".55" stop-color="#3D3A46" stop-opacity=".46"></stop>
        <stop offset="1" stop-color="#3D3A46" stop-opacity="0"></stop>
      </linearGradient>
      <filter id="neeSoft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3.2"></feGaussianBlur></filter>
      <filter id="neeShadowBlur" x="-60%" y="-160%" width="220%" height="420%"><feGaussianBlur stdDeviation="8"></feGaussianBlur></filter>
      <filter id="neeGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.4"></feGaussianBlur></filter>
      <mask id="neeMaskGibbous"><rect x="-12" y="-12" width="150" height="170" fill="#fff"></rect><circle cx="120" cy="56" r="47" fill="#000"></circle></mask>
      <mask id="neeMaskHalf"><rect x="-12" y="-12" width="150" height="170" fill="#fff"></rect><rect x="60" y="-12" width="80" height="170" fill="#000"></rect></mask>
      <mask id="neeMaskCrescent"><rect x="-12" y="-12" width="150" height="170" fill="#fff"></rect><circle cx="82" cy="54" r="48" fill="#000"></circle></mask>
    </defs>

    <ellipse cx="60" cy="124" rx="33" ry="6.5" fill="#3D3A46" opacity=".12" filter="url(#neeShadowBlur)" style="animation:neeShadow 3s cubic-bezier(.45,0,.55,1) infinite;transform-box:fill-box;transform-origin:center"></ellipse>

    <g transform="{{ tilt }}">
      <g mask="{{ maskUrl }}">
        <sc-if value="{{ arm_down }}"><g><ellipse cx="21" cy="86" rx="7.5" ry="10" transform="rotate(-32 21 86)" fill="#FFF6E5" stroke="#3D3A46" stroke-opacity=".42" stroke-width="2"></ellipse><ellipse cx="99" cy="86" rx="7.5" ry="10" transform="rotate(32 99 86)" fill="#FFF6E5" stroke="#3D3A46" stroke-opacity=".26" stroke-width="2"></ellipse></g></sc-if>
        <sc-if value="{{ arm_hold }}"><g><ellipse cx="21" cy="86" rx="7.5" ry="10" transform="rotate(-32 21 86)" fill="#FFF6E5" stroke="#3D3A46" stroke-opacity=".42" stroke-width="2"></ellipse><ellipse cx="99" cy="72" rx="7.5" ry="10" transform="rotate(52 99 72)" fill="#FFF6E5" stroke="#3D3A46" stroke-opacity=".26" stroke-width="2"></ellipse></g></sc-if>
        <sc-if value="{{ arm_oneUp }}"><g><ellipse cx="17" cy="88" rx="7.5" ry="10" transform="rotate(-32 17 88)" fill="#FFF6E5" stroke="#3D3A46" stroke-opacity=".42" stroke-width="2"></ellipse><ellipse cx="104" cy="28" rx="7.5" ry="10.5" transform="rotate(-34 104 28)" fill="#FFF6E5" stroke="#3D3A46" stroke-opacity=".3" stroke-width="2"></ellipse></g></sc-if>
        <sc-if value="{{ arm_bothUp }}"><g><ellipse cx="16" cy="28" rx="7.5" ry="10.5" transform="rotate(34 16 28)" fill="#FFF6E5" stroke="#3D3A46" stroke-opacity=".42" stroke-width="2"></ellipse><ellipse cx="104" cy="28" rx="7.5" ry="10.5" transform="rotate(-34 104 28)" fill="#FFF6E5" stroke="#3D3A46" stroke-opacity=".3" stroke-width="2"></ellipse></g></sc-if>
        <sc-if value="{{ arm_wide }}"><g><ellipse cx="7" cy="62" rx="10.5" ry="7.5" transform="rotate(-10 7 62)" fill="#FFF6E5" stroke="#3D3A46" stroke-opacity=".42" stroke-width="2"></ellipse><ellipse cx="113" cy="62" rx="10.5" ry="7.5" transform="rotate(10 113 62)" fill="#FFF6E5" stroke="#3D3A46" stroke-opacity=".26" stroke-width="2"></ellipse></g></sc-if>

        <path d="M60,10 C87,10 106,29 107,55 C108,81 87,102 60,102 C33,102 12,82 12,56 C12,30 33,11 60,10 Z" fill="#FFF6E5"></path>
        <g filter="url(#neeSoft)" fill="#3D3A46" opacity=".06">
          <circle cx="32" cy="32" r="12"></circle><circle cx="90" cy="44" r="8"></circle><circle cx="48" cy="88" r="9.5"></circle>
        </g>
        <path d="M60,10 C87,10 106,29 107,55 C108,81 87,102 60,102 C33,102 12,82 12,56 C12,30 33,11 60,10 Z" fill="none" stroke="url(#neeEdge)" stroke-width="2"></path>

        <g transform="{{ faceTransform }}">
          <sc-if value="{{ e_neutral }}"><g>
            <g fill="#2A2733" style="animation:neeBlink 6.5s ease-in-out infinite;transform-box:view-box;transform-origin:60px 49px"><circle cx="46" cy="49" r="4"></circle><circle cx="74" cy="49" r="4"></circle></g>
            <path d="M53,66 q7,3.5 14,0" fill="none" stroke="#2A2733" stroke-width="2" stroke-linecap="round"></path>
          </g></sc-if>
          <sc-if value="{{ e_happy }}"><g>
            <path d="M41,50 q5,-7 10,0" fill="none" stroke="#2A2733" stroke-width="2.6" stroke-linecap="round"></path>
            <path d="M69,50 q5,-7 10,0" fill="none" stroke="#2A2733" stroke-width="2.6" stroke-linecap="round"></path>
            <path d="M52,63 q8,11 16,0 z" fill="#2A2733"></path>
          </g></sc-if>
          <sc-if value="{{ e_curious }}"><g>
            <g fill="#2A2733" style="animation:neeBlink 5.5s ease-in-out infinite;transform-box:view-box;transform-origin:60px 49px"><circle cx="46" cy="49" r="5.2"></circle><circle cx="75" cy="49" r="3.6"></circle></g>
            <path d="M55,66 q5,4.5 9,-1" fill="none" stroke="#2A2733" stroke-width="2" stroke-linecap="round"></path>
          </g></sc-if>
          <sc-if value="{{ e_sleepy }}"><g>
            <path d="M40,48 q6,5.5 12,0" fill="none" stroke="#2A2733" stroke-width="2.4" stroke-linecap="round"></path>
            <path d="M68,48 q6,5.5 12,0" fill="none" stroke="#2A2733" stroke-width="2.4" stroke-linecap="round"></path>
            <path d="M56,66 h8" fill="none" stroke="#2A2733" stroke-width="2" stroke-linecap="round"></path>
          </g></sc-if>
          <sc-if value="{{ e_encouraging }}"><g>
            <path d="M41,51 q5,-6.5 10,0" fill="none" stroke="#2A2733" stroke-width="2.6" stroke-linecap="round"></path>
            <path d="M69,51 q5,-6.5 10,0" fill="none" stroke="#2A2733" stroke-width="2.6" stroke-linecap="round"></path>
            <path d="M53,63 q7,9.5 14,0 z" fill="#2A2733"></path>
          </g></sc-if>
          <sc-if value="{{ e_thoughtful }}"><g>
            <g fill="#2A2733" style="animation:neeBlink 7.5s ease-in-out infinite;transform-box:view-box;transform-origin:60px 46px"><circle cx="49" cy="46" r="4"></circle><circle cx="77" cy="46" r="4"></circle></g>
            <path d="M54,67 h11" fill="none" stroke="#2A2733" stroke-width="2" stroke-linecap="round"></path>
          </g></sc-if>
          <sc-if value="{{ e_celebrating }}"><g>
            <path d="M46,42 l2.2,5.1 5.1,1.9 -5.1,1.9 -2.2,5.1 -2.2,-5.1 -5.1,-1.9 5.1,-1.9 Z" fill="#2A2733"></path>
            <path d="M74,42 l2.2,5.1 5.1,1.9 -5.1,1.9 -2.2,5.1 -2.2,-5.1 -5.1,-1.9 5.1,-1.9 Z" fill="#2A2733"></path>
            <path d="M51,63 q9,12 18,0 z" fill="#2A2733"></path>
          </g></sc-if>
        </g>
      </g>

      <sc-if value="{{ showZ }}"><g>
        <text x="96" y="26" font-family="ui-rounded, -apple-system, system-ui" font-size="15" font-weight="700" fill="#3D3A46" opacity=".5" style="animation:neeZ 4s ease-out infinite">z</text>
      </g></sc-if>

      <sc-if value="{{ celebrate }}"><g stroke="#6B5CE7" stroke-width="2" stroke-linecap="round" opacity=".85">
        <g style="animation:neeSpark 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center"><path d="M8,20 v9 M3.5,24.5 h9"></path></g>
        <g style="animation:neeSpark 2.2s ease-out .5s infinite;transform-box:fill-box;transform-origin:center"><path d="M110,16 v8 M106,20 h8"></path></g>
        <g style="animation:neeSpark 2.2s ease-out 1s infinite;transform-box:fill-box;transform-origin:center"><path d="M14,104 v7 M10.5,107.5 h7"></path></g>
        <g style="animation:neeSpark 2.2s ease-out 1.5s infinite;transform-box:fill-box;transform-origin:center"><path d="M104,100 v7 M100.5,103.5 h7"></path></g>
      </g></sc-if>

      <sc-if value="{{ acc_hourglass }}"><g stroke="#3D3A46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M100,64 h18 M100,92 h18" ></path>
        <path d="M102,64 c0,8 14,10 14,14 c0,4 -14,6 -14,14" fill="#FFFFFF" fill-opacity=".5"></path>
        <path d="M116,64 c0,8 -14,10 -14,14 c0,4 14,6 14,14" fill="none"></path>
        <path d="M103.5,66 h11 l-5.5,10 z" fill="#E8A87C" stroke="none"></path>
        <path d="M109,80 v5" stroke="#E8A87C"></path>
      </g></sc-if>
      <sc-if value="{{ acc_lantern }}"><g>
        <path d="M108,58 v6" stroke="#3D3A46" stroke-width="2" stroke-linecap="round"></path>
        <rect x="96" y="64" width="24" height="26" rx="7" fill="#E07A6B" fill-opacity=".85" stroke="#3D3A46" stroke-width="2"></rect>
        <path d="M108,66 v22" stroke="#FAF8F5" stroke-opacity=".5" stroke-width="1.5"></path>
        <path d="M104,90 v5 M112,90 v5" stroke="#E8B04B" stroke-width="2" stroke-linecap="round"></path>
      </g></sc-if>
      <sc-if value="{{ acc_incense }}"><g stroke="#3D3A46" stroke-width="2" stroke-linecap="round" fill="none">
        <path d="M108,94 v-30"></path>
        <path d="M108,60 c-6,-5 6,-9 0,-14 c-5,-4 4,-8 0,-12" stroke-opacity=".35"></path>
        <ellipse cx="108" cy="96" rx="9" ry="3.5" fill="#A8DCC8" stroke="#3D3A46"></ellipse>
      </g></sc-if>
      <sc-if value="{{ acc_teacup }}"><g stroke="#3D3A46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M96,72 h22 v9 a11,9 0 0 1 -22,0 z" fill="#A8DCC8" fill-opacity=".7"></path>
        <path d="M118,74 c6,0 6,7 0,7" fill="none"></path>
        <path d="M104,64 c-4,-4 4,-6 0,-10" fill="none" stroke-opacity=".3"></path>
      </g></sc-if>
      <sc-if value="{{ acc_envelope }}"><g>
        <rect x="94" y="62" width="26" height="34" rx="6" fill="#E07A6B" stroke="#3D3A46" stroke-width="2"></rect>
        <circle cx="107" cy="79" r="6" fill="#E8B04B" stroke="#3D3A46" stroke-width="1.6"></circle>
        <path d="M94,72 h26" stroke="#3D3A46" stroke-width="1.6" stroke-opacity=".5"></path>
      </g></sc-if>
      <sc-if value="{{ acc_blossom }}"><g>
        <path d="M98,96 c8,-8 12,-20 14,-32" fill="none" stroke="#3D3A46" stroke-width="2" stroke-linecap="round"></path>
        <g fill="#E8A87C" stroke="#3D3A46" stroke-width="1.4">
          <circle cx="113" cy="60" r="4.5"></circle><circle cx="105" cy="72" r="4"></circle><circle cx="117" cy="72" r="3.4"></circle>
        </g>
      </g></sc-if>
    </g>
  </svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:230},&quot;expression&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;neutral&quot;,&quot;happy&quot;,&quot;curious&quot;,&quot;sleepy&quot;,&quot;encouraging&quot;,&quot;thoughtful&quot;,&quot;celebrating&quot;],&quot;default&quot;:&quot;neutral&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;phase&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;full&quot;,&quot;gibbous&quot;,&quot;half&quot;,&quot;crescent&quot;],&quot;default&quot;:&quot;full&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;accessory&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;hourglass&quot;,&quot;lantern&quot;,&quot;incense&quot;,&quot;teacup&quot;,&quot;envelope&quot;,&quot;blossom&quot;],&quot;default&quot;:&quot;none&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;arms&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;down&quot;,&quot;oneUp&quot;,&quot;bothUp&quot;,&quot;wide&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const e = this.props.expression || 'neutral';
    const p = this.props.phase || 'full';
    const acc = this.props.accessory || 'none';
    const defaultArms = { encouraging: 'bothUp', celebrating: 'wide', happy: 'oneUp' }[e] || 'down';
    const arms = this.props.arms || (acc !== 'none' ? 'hold' : defaultArms);
    const maskMap = { full: 'none', gibbous: 'url(#neeMaskGibbous)', half: 'url(#neeMaskHalf)', crescent: 'url(#neeMaskCrescent)' };
    const tilt = e === 'curious' ? 'rotate(8 60 56)' : 'rotate(0 60 56)';
    const faceTransform = p === 'crescent'
      ? 'translate(-30 0) translate(60 56) scale(0.52) translate(-60 -56)'
      : (p === 'half' ? 'translate(-13 0) translate(60 56) scale(0.8) translate(-60 -56)' : 'translate(0 0)');
    return {
      maskUrl: maskMap[p] || 'none', tilt, faceTransform,
      e_neutral: e === 'neutral', e_happy: e === 'happy', e_curious: e === 'curious',
      e_sleepy: e === 'sleepy', e_encouraging: e === 'encouraging',
      e_thoughtful: e === 'thoughtful', e_celebrating: e === 'celebrating',
      arm_down: arms === 'down', arm_oneUp: arms === 'oneUp', arm_bothUp: arms === 'bothUp', arm_wide: arms === 'wide', arm_hold: arms === 'hold',
      showZ: e === 'sleepy', celebrate: e === 'celebrating',
      acc_hourglass: acc === 'hourglass', acc_lantern: acc === 'lantern', acc_incense: acc === 'incense',
      acc_teacup: acc === 'teacup', acc_envelope: acc === 'envelope', acc_blossom: acc === 'blossom'
    };
  }
}
</script>
</body>
</html>
